name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk \
            unzip autoconf automake libtool pkg-config libncurses-dev cmake \
            libffi-dev libssl-dev ccache

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/licenses/android-sdk-license

      - name: Build APK
        working-directory: android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-apk
          path: android/bin/*.apk
